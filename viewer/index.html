<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Knowledge Galaxy</title>
<style>
  /*
    Direction: a hand-drafted celestial atlas, not a sci-fi HUD.
    Deep space ground; a single warm beacon accent (amber, like a
    marked star on a chart or a brass instrument dial); serif for
    note titles (atlas-plate lettering); monospace for coordinates/
    paths (instrument readouts); categorical node colors drawn from
    real stellar classification (hot blue -> cool red), so the
    palette encodes something true rather than reading as decoration.
    Deliberately single-theme: it's a night sky, so it stays one.
  */
  :root {
    color-scheme: dark;
    --void: #05060b;
    --void-2: #0b0d18;
    --starlight: #eef0fb;
    --dim: #7c86ad;
    --line: rgba(148, 156, 199, 0.2);
    --accent: #ffb86b;
    --accent-dim: rgba(255, 184, 107, 0.35);

    --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--void);
    overflow: hidden;
    font-family: var(--font-ui);
    color: var(--starlight);
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #graph {
    position: fixed;
    inset: 0;
    z-index: 1;
  }

  /* ---- backdrop: a stormy dusk horizon behind the graph's WebGL canvas,
     which renders with a transparent background so this shows through
     (see Graph.backgroundColor in the script) ---- */
  #scene-backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #scene-backdrop svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- title strip, like the caption on an atlas plate ---- */
  #hint {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 5;
    display: flex;
    align-items: baseline;
    gap: 10px;
    pointer-events: none;
    animation: fade-in 1.1s ease-out both;
  }
  #hint .mark {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.02em;
    color: var(--starlight);
  }
  #hint .sep { color: var(--line); }
  #hint .sub {
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* ---- catalog key, bottom-left legend ---- */
  #legend {
    position: fixed;
    bottom: 22px;
    left: 24px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: rgba(11, 13, 24, 0.55);
    backdrop-filter: blur(6px);
    pointer-events: none;
    animation: fade-in 1.1s ease-out 0.15s both;
  }
  #legend .row { display: flex; align-items: center; gap: 9px; }
  #legend .swatch {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    box-shadow: 0 0 7px 1.5px currentColor;
    flex: none;
  }
  #legend .row span:last-child {
    font-family: var(--font-ui);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--dim);
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #mute-toggle {
    position: fixed;
    top: 20px;
    right: 24px;
    z-index: 5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(11, 13, 24, 0.55);
    backdrop-filter: blur(6px);
    color: var(--starlight);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    animation: fade-in 1.1s ease-out 0.15s both;
  }
  #mute-toggle:hover { border-color: var(--dim); }
  #mute-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #mute-toggle.muted {
    color: var(--dim);
    border-color: rgba(255, 90, 90, 0.4);
    background: rgba(255, 90, 90, 0.08);
  }

  #backdrop-toggle {
    position: fixed;
    top: 20px;
    right: 68px;
    z-index: 5;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(11, 13, 24, 0.55);
    backdrop-filter: blur(6px);
    color: var(--starlight);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    animation: fade-in 1.1s ease-out 0.15s both;
  }
  #backdrop-toggle:hover { border-color: var(--accent-dim); }
  #backdrop-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- observation card, slide-in side panel ---- */
  #panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(400px, 88vw);
    background: linear-gradient(180deg, var(--void-2), var(--void));
    border-left: 1px solid var(--line);
    box-shadow: -30px 0 70px rgba(0, 0, 0, 0.55);
    transform: translateX(100%);
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10;
    padding: 30px 28px;
    overflow-y: auto;
  }
  #panel.open { transform: translateX(0); }

  #panel-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--dim);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  #panel-close:hover { color: var(--starlight); border-color: var(--dim); }
  #panel-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #panel-group {
    display: inline-block;
    font-family: var(--font-ui);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 4px 11px;
    margin-bottom: 16px;
  }

  #panel-title {
    font-family: var(--font-display);
    font-size: 25px;
    font-weight: 500;
    margin: 0 0 6px;
    line-height: 1.3;
    padding-right: 30px;
    text-wrap: balance;
  }

  #panel-path {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.01em;
    color: var(--dim);
    margin: 0 0 22px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    word-break: break-all;
  }

  #panel-excerpt {
    font-family: var(--font-display);
    font-size: 15.5px;
    line-height: 1.65;
    color: var(--starlight);
    white-space: pre-wrap;
    margin: 0 0 26px;
    max-width: 34em;
  }

  #panel-links-label {
    font-family: var(--font-ui);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin: 0 0 10px;
  }

  #panel-links {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #panel-links li a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--starlight);
    text-decoration: none;
    font-family: var(--font-ui);
    font-size: 13.5px;
    padding: 9px 11px;
    border-radius: 4px;
    border: 1px solid transparent;
    background: rgba(238, 240, 251, 0.03);
    transition: background 0.15s, border-color 0.15s;
  }
  #panel-links li a::before {
    content: "\2192";
    color: var(--accent);
    font-size: 12px;
  }
  #panel-links li a:hover,
  #panel-links li a:focus-visible {
    background: rgba(255, 184, 107, 0.08);
    border-color: var(--accent-dim);
  }
  #panel-links li a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #panel-empty {
    font-family: var(--font-ui);
    font-size: 13px;
    color: var(--dim);
    font-style: italic;
  }

  /* ---- chat dock: ask the galaxy a question ---- */
  #chatdock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px 22px;
    pointer-events: none;
  }
  #chat-transcript {
    width: min(640px, 100%);
    max-height: 32vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 10px;
    pointer-events: auto;
  }
  #chat-transcript:empty { margin-bottom: 0; }
  .chat-entry {
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: auto;
    animation: fade-in 0.35s ease-out both;
  }
  .chat-question {
    font-family: var(--font-ui);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .chat-answer {
    font-family: var(--font-display);
    font-size: 15px;
    line-height: 1.6;
    color: var(--starlight);
    background: rgba(11, 13, 24, 0.72);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    backdrop-filter: blur(8px);
    white-space: pre-wrap;
  }
  .chat-entry.pending .chat-answer {
    color: var(--dim);
    font-style: italic;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .chat-answer.error { color: #ffb0a0; border-color: rgba(255, 120, 100, 0.35); }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

  .chat-boot .chat-answer {
    font-style: italic;
    color: var(--dim);
    border-color: var(--accent-dim);
    background: rgba(255, 184, 107, 0.05);
  }

  .chat-sources {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chat-source-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.01em;
    padding: 4px 10px;
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    color: var(--accent);
    background: rgba(255, 184, 107, 0.08);
    cursor: pointer;
    transition: background 0.15s;
  }
  .chat-source-chip:hover,
  .chat-source-chip:focus-visible {
    background: rgba(255, 184, 107, 0.2);
  }
  .chat-source-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #chat-form {
    width: min(640px, 100%);
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
    background: rgba(11, 13, 24, 0.8);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    transition: border-color 0.15s;
  }
  #chat-form:focus-within { border-color: var(--accent-dim); }

  #chat-input {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    outline: none;
    color: var(--starlight);
    font-family: var(--font-ui);
    font-size: 14px;
    padding: 11px 0;
  }
  #chat-input::placeholder { color: var(--dim); }

  #chat-send {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--accent-dim);
    background: rgba(255, 184, 107, 0.12);
    color: var(--accent);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  #chat-send:hover:not(:disabled) { background: rgba(255, 184, 107, 0.24); }
  #chat-send:disabled { opacity: 0.4; cursor: default; }
  #chat-input:focus-visible,
  #chat-send:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #chat-mic {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(238, 240, 251, 0.05);
    color: var(--dim);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  #chat-mic:hover:not(:disabled) { border-color: var(--accent-dim); color: var(--starlight); }
  #chat-mic:disabled { opacity: 0.3; cursor: not-allowed; }
  #chat-mic:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #chat-mic.listening {
    border-color: rgba(255, 90, 90, 0.55);
    color: #ff5a5a;
    background: rgba(255, 90, 90, 0.12);
    animation: mic-pulse 1.2s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 90, 90, 0.35); }
    50% { box-shadow: 0 0 0 8px rgba(255, 90, 90, 0); }
  }

  #chat-status {
    width: min(640px, 100%);
    min-height: 16px;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.06em;
    color: var(--dim);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  #chat-status.visible { opacity: 1; }
  #chat-status .dot {
    color: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  #chat-status.listening .dot { color: #ff5a5a; }
</style>
</head>
<body>

<div id="hint">
  <span class="mark">Knowledge Galaxy</span>
  <span class="sep">·</span>
  <span class="sub">drag to orbit &middot; scroll to zoom &middot; click a star to read</span>
</div>

<button id="mute-toggle" type="button" aria-label="Mute voice output" title="Mute the galaxy's voice">🔊</button>
<button id="backdrop-toggle" type="button" aria-label="Change backdrop" title="Backdrop: Dusk Storm — click for next">🖼️</button>

<div id="legend"></div>

<div id="scene-backdrop" aria-hidden="true">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#05040a"/>
        <stop offset="32%" stop-color="#241226"/>
        <stop offset="58%" stop-color="#7a2e1d"/>
        <stop offset="78%" stop-color="#d9601f"/>
        <stop offset="93%" stop-color="#ffb35c"/>
        <stop offset="100%" stop-color="#ffdca0"/>
      </linearGradient>
      <linearGradient id="sea-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ffb35c"/>
        <stop offset="8%" stop-color="#8a3a22"/>
        <stop offset="38%" stop-color="#1a0f1c"/>
        <stop offset="100%" stop-color="#050308"/>
      </linearGradient>
      <radialGradient id="sun-glow" cx="50%" cy="100%" r="60%">

    </defs>

    <rect x="0" y="0" width="1600" height="900" fill="url(#sky-grad)"/>
    <ellipse cx="800" cy="605" rx="520" ry="270" fill="url(#sun-glow)"/>

    <g fill="#0b060d" opacity="0.55">
      <ellipse cx="220" cy="130" rx="260" ry="55"/>
      <ellipse cx="390" cy="100" rx="180" ry="42"/>
      <ellipse cx="1260" cy="85" rx="300" ry="65"/>
      <ellipse cx="1430" cy="145" rx="200" ry="48"/>
      <ellipse cx="700" cy="55" rx="220" ry="38" opacity="0.4"/>
    </g>

    <path d="M0,640 L120,580 L260,610 L420,558 L600,598 L820,552 L1040,602 L1260,562 L1440,612 L1600,588 L1600,650 L0,650 Z" fill="#08050a"/>

    <rect x="0" y="620" width="1600" height="280" fill="url(#sea-grad)"/>
    <ellipse cx="900" cy="646" rx="230" ry="20" fill="#1a0f1c" opacity="0.6"/>

    <!-- a large original creature silhouette breaching the water, not a
         reproduction of any specific published design -->

    <path d="M898,428 C910,406 932,396 948,402 C936,420 918,430 898,428 Z" fill="#040308"/>

    <path d="M0,900 L0,758 L92,698 L222,738 L342,688 L424,718 L424,900 Z" fill="#020103"/>
    <rect x="148" y="670" width="6" height="32" fill="#020103"/>
    <circle cx="151" cy="663" r="7" fill="#020103"/>
  </svg>
</div>

<script>
  // Plain (non-module) script, deliberately separate from the 3D graph's
  // ES module script below: that module imports three.js/3d-force-graph
  // from a CDN, and ES modules don't run ANY of their top-level code until
  // every import resolves - so if this logic lived there, a slow or
  // blocked CDN would silently break backdrop switching too. This runs
  // immediately, independent of that.
  (function () {
    "use strict";
    var backdropEl = document.getElementById("scene-backdrop");
    var toggleBtn = document.getElementById("backdrop-toggle");

    // Each entry is {name, svg}. The first entry is captured directly from
    // the backdrop's own markup above at load time, so that artwork exists
    // in exactly one place - not duplicated into this array by hand. New
    // backgrounds just get appended here as {name, svg} objects.
    var BACKDROPS = [
      { name: "Dusk Storm", svg: backdropEl.innerHTML }
    ];

    var STORAGE_KEY = "jarvisBackdropIndex";
    var index = 0;
    try {
      var saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      if (!isNaN(saved) && saved >= 0 && saved < BACKDROPS.length) index = saved;
    } catch (e) { /* localStorage unavailable (private mode, etc.) */ }

    function applyBackdrop(i) {
      index = ((i % BACKDROPS.length) + BACKDROPS.length) % BACKDROPS.length;
      backdropEl.innerHTML = BACKDROPS[index].svg;
      toggleBtn.title = "Backdrop: " + BACKDROPS[index].name + " — click for next";
      try { localStorage.setItem(STORAGE_KEY, String(index)); } catch (e) { /* ignore */ }
    }

    if (index !== 0) applyBackdrop(index);

    toggleBtn.addEventListener("click", function () {
      applyBackdrop(index + 1);
    });
  })();
</script>

<div id="graph"></div>

<div id="panel">
  <button id="panel-close" aria-label="Close">&times;</button>
  <span id="panel-group"></span>
  <h2 id="panel-title"></h2>
  <p id="panel-path"></p>
  <p id="panel-excerpt"></p>
  <p id="panel-links-label">Cross-references</p>
  <ul id="panel-links"></ul>
</div>

<div id="chatdock">
  <div id="chat-transcript" aria-live="polite"></div>
  <div id="chat-status" aria-live="polite"></div>
  <form id="chat-form" autocomplete="off">
    <button id="chat-mic" type="button" aria-label="Speak your question" title="Click to start speaking, click again when you're done">🎙</button>
    <input id="chat-input" type="text" placeholder="Ask your galaxy…" autocomplete="off" />
    <button id="chat-send" type="submit" aria-label="Ask">&#8594;</button>
  </form>
</div>

<script src="graph-data.js"></script>
<script type="module">
import ForceGraph3D from "https://esm.sh/3d-force-graph@1.80.0?deps=three@0.180.0";
import * as THREE from "https://esm.sh/three@0.180.0";

(function () {
  "use strict";

  var data = window.GRAPH || { nodes: [], links: [] };
  var nodes = data.nodes || [];
  var links = data.links || [];

  // Categorical palette follows real stellar classification order (hot blue
  // -> cool red: O B A F G K M) so groups read as points on one real scale
  // rather than an arbitrary rainbow. Saturated for on-screen legibility,
  // the way false-color astrophotography is. Cycles past 7 folders.
  var PALETTE = [
    "#5fa8ff", // O - blue
    "#7ee0e8", // B - cyan
    "#eef0fb", // A - white
    "#ffe066", // F - yellow
    "#ffb15c", // G - gold (sun-like)
    "#ff7a5c", // K - orange
    "#ff4d6d"  // M - red
  ];
  var groupColors = {};
  var groupOrder = [];
  nodes.forEach(function (n) {
    if (!(n.group in groupColors)) {
      groupColors[n.group] = PALETTE[groupOrder.length % PALETTE.length];
      groupOrder.push(n.group);
    }
  });

  var legendEl = document.getElementById("legend");

  function addLegendRow(group, color) {
    var row = document.createElement("div");
    row.className = "row";
    var sw = document.createElement("span");
    sw.className = "swatch";
    sw.style.color = color;
    sw.style.background = color;
    var label = document.createElement("span");
    label.textContent = group;
    row.appendChild(sw);
    row.appendChild(label);
    legendEl.appendChild(row);
  }
  groupOrder.forEach(function (g) { addLegendRow(g, groupColors[g]); });

  // Assigns (and legends) a palette color for a group discovered live, e.g.
  // the first time a "captures" note is remembered by voice.
  function ensureGroupColor(group) {
    if (groupColors[group]) return groupColors[group];
    var color = PALETTE[groupOrder.length % PALETTE.length];
    groupColors[group] = color;
    groupOrder.push(group);
    addLegendRow(group, color);
    return color;
  }

  // ---- adjacency, built once from links (source/target are numeric ids) ----
  var neighborIds = {};   // id -> Set of neighbor ids
  var neighborLinks = {}; // id -> Set of link objects touching this node
  nodes.forEach(function (n) { neighborIds[n.id] = new Set(); neighborLinks[n.id] = new Set(); });
  links.forEach(function (l) {
    neighborIds[l.source].add(l.target);
    neighborIds[l.target].add(l.source);
    neighborLinks[l.source].add(l);
    neighborLinks[l.target].add(l);
  });

  var nodesById = {};
  nodes.forEach(function (n) { nodesById[n.id] = n; });

  // ---- highlight state --------------------------------------------------
  var highlightNodes = new Set();
  var highlightLinks = new Set();
  var selectedId = null;

  function clearHighlight() {
    highlightNodes.clear();
    highlightLinks.clear();
    selectedId = null;
  }

  function setHighlight(node) {
    clearHighlight();
    selectedId = node.id;
    highlightNodes.add(node.id);
    neighborIds[node.id].forEach(function (id) { highlightNodes.add(id); });
    neighborLinks[node.id].forEach(function (l) { highlightLinks.add(l); });
  }

  // link.source/target start as raw ids but get mutated into node object
  // references once the force simulation takes over - this reads either.
  function linkEndpointId(endpoint) {
    return endpoint && typeof endpoint === "object" ? endpoint.id : endpoint;
  }

  // Lights up a whole set of nodes (e.g. every source an answer drew on)
  // plus the links directly connecting them, with no single node "selected".
  function setClusterHighlight(ids) {
    clearHighlight();
    ids.forEach(function (id) { highlightNodes.add(id); });
    links.forEach(function (l) {
      if (highlightNodes.has(linkEndpointId(l.source)) && highlightNodes.has(linkEndpointId(l.target))) {
        highlightLinks.add(l);
      }
    });
  }

  // ---- three.js glow sprite, shared texture ------------------------------
  function makeGlowTexture() {
    var size = 128;
    var canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    var ctx = canvas.getContext("2d");
    var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grad.addColorStop(0, "rgba(255,255,255,1)");
    grad.addColorStop(0.25, "rgba(255,255,255,0.6)");
    grad.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    return new THREE.CanvasTexture(canvas);
  }
  var glowTexture = makeGlowTexture();

  function makeNodeObject(node) {
    var group = new THREE.Group();
    var color = groupColors[node.group] || "#ffffff";

    var core = new THREE.Mesh(
      new THREE.SphereGeometry(3.2, 16, 16),
      new THREE.MeshBasicMaterial({ color: color })
    );
    group.add(core);

    var glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexture,
      color: color,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    glow.scale.set(22, 22, 1);
    glow.userData.isGlow = true;
    group.add(glow);

    group.userData.nodeId = node.id;
    return group;
  }

  // ---- sparse stars, added straight into the graph's own three.js scene --
  // Dialed back from a full starfield: the painted dusk sky behind the
  // (now-transparent) canvas already carries most of the atmosphere, so
  // this only needs to read as a few points breaking through storm clouds.
  function makeStarfield() {
    var starGroup = new THREE.Group();
    var layers = [
      { count: 700, radius: 3200, size: 2.0, opacity: 0.5 },
      { count: 450, radius: 5200, size: 3.0, opacity: 0.32 },
      { count: 300, radius: 7800, size: 4.4, opacity: 0.2 }
    ];
    layers.forEach(function (layer) {
      var positions = new Float32Array(layer.count * 3);
      for (var i = 0; i < layer.count; i++) {
        var r = layer.radius * (0.5 + 0.5 * Math.random());
        var theta = Math.acos(2 * Math.random() - 1);
        var phi = 2 * Math.PI * Math.random();
        positions[i * 3] = r * Math.sin(theta) * Math.cos(phi);
        positions[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
        positions[i * 3 + 2] = r * Math.cos(theta);
      }
      var geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      var mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: layer.size,
        transparent: true,
        opacity: layer.opacity,
        sizeAttenuation: true,
        map: glowTexture,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });
      starGroup.add(new THREE.Points(geom, mat));
    });
    return starGroup;
  }

  // ---- build the graph ----------------------------------------------------
  var elem = document.getElementById("graph");
  var Graph = ForceGraph3D()(elem)
    .backgroundColor("rgba(0,0,0,0)") // transparent - the painted backdrop shows through
    .graphData({ nodes: nodes, links: links })
    .nodeId("id")
    .nodeLabel(function (n) { return n.label; })
    .nodeThreeObjectExtend(false)
    .linkColor(function (l) {
      return highlightLinks.has(l) ? "#ffffff" : "rgba(140,160,220,0.35)";
    })
    .linkWidth(function (l) { return highlightLinks.has(l) ? 1.6 : 0.6; })
    .linkOpacity(0.4)
    .linkDirectionalParticles(function (l) { return highlightLinks.has(l) ? 3 : 0; })
    .linkDirectionalParticleWidth(1.8)
    .linkDirectionalParticleSpeed(0.006)
    .onNodeClick(handleNodeClick)
    .onBackgroundClick(closePanel)
    .cooldownTime(4000);

  // id -> birth timestamp (ms), for the brief glow pulse a newly remembered
  // node gets as it's born; entries expire and remove themselves.
  var birthPulses = {};
  var BIRTH_PULSE_MS = 1400;

  // dim non-highlighted nodes/links whenever a selection or cluster is lit
  Graph.nodeThreeObject(function (node) {
    var obj = makeNodeObject(node);
    var birthStart = birthPulses[node.id];
    var dimmed = !birthStart && highlightNodes.size > 0 && !highlightNodes.has(node.id);
    obj.children.forEach(function (child) {
      if (child.material) {
        child.material.transparent = true;
        child.material.opacity = dimmed ? 0.15 : (child.userData && child.userData.isGlow ? 0.85 : 1);
      }
    });
    var scale = node.id === selectedId ? 1.6 : (highlightNodes.has(node.id) ? 1.25 : 1);
    if (birthStart) {
      var t = Math.min(1, (performance.now() - birthStart) / BIRTH_PULSE_MS);
      scale *= 1 + 0.9 * (1 - t) * (0.5 + 0.5 * Math.sin(t * Math.PI * 6));
    }
    obj.scale.set(scale, scale, scale);
    return obj;
  });

  function pulseGlow(id) {
    birthPulses[id] = performance.now();
    (function tick() {
      if (performance.now() - birthPulses[id] > BIRTH_PULSE_MS) {
        delete birthPulses[id];
        Graph.refresh();
        return;
      }
      Graph.refresh();
      requestAnimationFrame(tick);
    })();
  }

  // starfield lives directly in the scene, independent of the node graph
  Graph.scene().add(makeStarfield());
  // A dark storm-purple rather than pure black, so distant nodes fade into
  // something close to the backdrop's upper sky instead of clashing with it.
  Graph.scene().fog = new THREE.FogExp2(0x140b18, 0.00024);

  // slow idle drift via OrbitControls' built-in auto-rotate
  var controls = Graph.controls();
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // gently space nodes out in 3D so the galaxy doesn't collapse flat
  Graph.d3Force("charge").strength(-160);

  window.addEventListener("resize", function () {
    Graph.width(window.innerWidth).height(window.innerHeight);
  });

  // ---- side panel -----------------------------------------------------
  var panel = document.getElementById("panel");
  var panelGroup = document.getElementById("panel-group");
  var panelTitle = document.getElementById("panel-title");
  var panelPath = document.getElementById("panel-path");
  var panelExcerpt = document.getElementById("panel-excerpt");
  var panelLinks = document.getElementById("panel-links");
  var panelLinksLabel = document.getElementById("panel-links-label");
  document.getElementById("panel-close").addEventListener("click", closePanel);

  function openPanel(node) {
    panelGroup.textContent = node.group;
    panelGroup.style.color = groupColors[node.group];
    panelGroup.style.borderColor = groupColors[node.group];
    panelTitle.textContent = node.label;
    panelPath.textContent = node.path || "";
    panelExcerpt.textContent = node.excerpt || "";

    panelLinks.innerHTML = "";
    var neighbors = Array.from(neighborIds[node.id]).map(function (id) { return nodesById[id]; })
      .filter(Boolean)
      .sort(function (a, b) { return a.label.localeCompare(b.label); });

    panelLinksLabel.style.display = neighbors.length ? "block" : "none";
    if (!neighbors.length) {
      var empty = document.createElement("li");
      empty.id = "panel-empty";
      empty.textContent = "No cross-references yet";
      panelLinks.appendChild(empty);
    } else {
      neighbors.forEach(function (nb) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = "#";
        a.textContent = nb.label;
        a.addEventListener("click", function (e) {
          e.preventDefault();
          focusNode(nb);
        });
        li.appendChild(a);
        panelLinks.appendChild(li);
      });
    }

    panel.classList.add("open");
  }

  function closePanel() {
    panel.classList.remove("open");
    clearHighlight();
    controls.autoRotate = true;
    Graph.refresh();
  }

  function flyTo(node) {
    var distance = 140;
    var distRatio = 1 + distance / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
    controls.autoRotate = false;
    Graph.cameraPosition(
      { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
      node,
      1400
    );
  }

  // Frames the whole set of cluster nodes in view, rather than flying to
  // any single one of them: centers on their centroid and backs off far
  // enough (based on their spread) that all of them stay on screen.
  function flyToCluster(clusterNodes) {
    if (!clusterNodes.length) return;
    var cx = 0, cy = 0, cz = 0;
    clusterNodes.forEach(function (n) { cx += n.x || 0; cy += n.y || 0; cz += n.z || 0; });
    cx /= clusterNodes.length; cy /= clusterNodes.length; cz /= clusterNodes.length;

    var spread = 0;
    clusterNodes.forEach(function (n) {
      var d = Math.hypot((n.x || 0) - cx, (n.y || 0) - cy, (n.z || 0) - cz);
      if (d > spread) spread = d;
    });

    var distance = Math.max(260, spread * 2.3 + 200);
    var dirLen = Math.hypot(cx, cy, cz) || 1;
    controls.autoRotate = false;
    Graph.cameraPosition(
      {
        x: cx + (cx / dirLen || 0.001) * distance,
        y: cy + (cy / dirLen || 0.001) * distance,
        z: cz + (cz / dirLen || 0.001) * distance
      },
      { x: cx, y: cy, z: cz },
      1600
    );
  }

  function focusNode(node) {
    setHighlight(node);
    flyTo(node);
    openPanel(node);
    Graph.refresh();
  }

  function handleNodeClick(node) {
    if (selectedId === node.id) {
      closePanel();
      return;
    }
    focusNode(node);
  }

  var CLUSTER_THRESHOLD = 4;

  function focusCluster(nodeIds) {
    var clusterNodes = nodeIds.map(function (id) { return nodesById[id]; }).filter(Boolean);
    if (!clusterNodes.length) return;
    panel.classList.remove("open");
    setClusterHighlight(nodeIds);
    flyToCluster(clusterNodes);
    Graph.refresh();
  }

  // Called with the source node ids an answer drew on, to make the galaxy
  // visually "prove" where the answer came from: fly to and open the one
  // top source, or - if the answer spanned a whole cluster of notes - light
  // up the cluster instead of picking a single node to fly to.
  function revealSources(nodeIds) {
    if (!nodeIds || !nodeIds.length) return;
    if (nodeIds.length >= CLUSTER_THRESHOLD) {
      focusCluster(nodeIds);
      return;
    }
    var top = nodesById[nodeIds[0]];
    if (top) focusNode(top);
  }

  function graphCentroid() {
    var cx = 0, cy = 0, cz = 0;
    nodes.forEach(function (n) { cx += n.x || 0; cy += n.y || 0; cz += n.z || 0; });
    var count = nodes.length || 1;
    return { x: cx / count, y: cy / count, z: cz / count };
  }

  // Grows the galaxy live: adds a note just written via "remember that...",
  // born at its closest relative's position (or the graph's centroid if it
  // has no clear relative) with a brief glow pulse, then flies to it.
  function birthNode(newNode, anchorId, linkTargetIds) {
    if (!newNode) return;
    ensureGroupColor(newNode.group);

    var anchor = (anchorId !== null && anchorId !== undefined) ? nodesById[anchorId] : null;
    var spawn = anchor ? { x: anchor.x || 0, y: anchor.y || 0, z: anchor.z || 0 } : graphCentroid();
    var jitter = 14;
    newNode.x = spawn.x + (Math.random() - 0.5) * jitter;
    newNode.y = spawn.y + (Math.random() - 0.5) * jitter;
    newNode.z = spawn.z + (Math.random() - 0.5) * jitter;

    nodesById[newNode.id] = newNode;
    neighborIds[newNode.id] = new Set();
    neighborLinks[newNode.id] = new Set();

    var newLinks = (linkTargetIds || []).map(function (targetId) {
      return { source: newNode.id, target: targetId };
    });
    newLinks.forEach(function (l) {
      neighborIds[newNode.id].add(l.target);
      neighborLinks[newNode.id].add(l);
      if (neighborIds[l.target]) {
        neighborIds[l.target].add(newNode.id);
        neighborLinks[l.target].add(l);
      }
    });

    nodes.push(newNode);
    links.push.apply(links, newLinks);
    Graph.graphData({ nodes: nodes, links: links });

    pulseGlow(newNode.id);
    focusNode(newNode);
  }

  // ---- chat dock: ask the galaxy a question --------------------------
  var chatSessionId = null;
  // True from the moment a question/capture is sent until its response
  // comes back - blocks a second mic click or Enter from firing a
  // concurrent request while one is still in flight, which used to let two
  // answers land (and speak) on top of each other.
  var requestBusy = false;
  var chatForm = document.getElementById("chat-form");
  var chatInput = document.getElementById("chat-input");
  var chatSend = document.getElementById("chat-send");
  var chatMic = document.getElementById("chat-mic");
  var chatStatus = document.getElementById("chat-status");
  var chatTranscript = document.getElementById("chat-transcript");

  // ---- boot greeting: shown the instant the page loads; spoken as soon as
  // the browser lets audio through (see unlockAudio below) ----
  var bootGreetingText = "Good evening, sir. " + nodes.length + " notes indexed, all present and accounted for.";
  var bootGreetingSpoken = false;

  function showBootGreeting() {
    var entry = document.createElement("div");
    entry.className = "chat-entry chat-boot";
    var a = document.createElement("div");
    a.className = "chat-answer";
    a.textContent = bootGreetingText;
    entry.appendChild(a);
    chatTranscript.appendChild(entry);
    chatTranscript.scrollTop = chatTranscript.scrollHeight;
  }
  showBootGreeting();

  function speakBootGreeting() {
    if (bootGreetingSpoken) return;
    bootGreetingSpoken = true;
    speak(bootGreetingText);
  }

  function setStatus(state) {
    if (state === "listening") {
      chatStatus.innerHTML = '<span class="dot">&#9679;</span> listening&hellip; (click mic when done)';
      chatStatus.className = "visible listening";
    } else if (state === "thinking") {
      chatStatus.innerHTML = '<span class="dot">&#9679;</span> thinking&hellip;';
      chatStatus.className = "visible";
    } else {
      chatStatus.textContent = "";
      chatStatus.className = "";
    }
  }

  // ---- voice out: speechSynthesis, preferring a British English voice ----
  var synth = window.speechSynthesis;
  var chosenVoice = null;
  var audioUnlocked = false;

  function pickVoice() {
    if (!synth) return null;
    var voices = synth.getVoices() || [];
    if (!voices.length) return null;
    return (
      voices.find(function (v) { return v.lang === "en-GB"; }) ||
      voices.find(function (v) { return /^en-GB/i.test(v.lang); }) ||
      voices.find(function (v) { return /british|uk english/i.test(v.name); }) ||
      voices.find(function (v) { return /^en/i.test(v.lang); }) ||
      voices[0]
    );
  }

  if (synth) {
    chosenVoice = pickVoice();
    synth.addEventListener("voiceschanged", function () { chosenVoice = pickVoice(); });
  }

  // Browsers hold speechSynthesis until a real user gesture unlocks it, so
  // the boot greeting can only be spoken (not just shown) once the visitor
  // has clicked/tapped once - this is that first utterance, doing double
  // duty as the unlock so later, async (post-fetch) speak() calls work too.
  function unlockAudio() {
    if (audioUnlocked || !synth) return;
    audioUnlocked = true;
    speakBootGreeting();
  }
  document.addEventListener("pointerdown", unlockAudio, { once: true });

  // Safety net on top of the "answer in 2-3 sentences" system prompt: the
  // note itself is visible on screen, so speech never needs to read more
  // than a short spoken answer - cut at the nearest sentence boundary.
  var SPEECH_CHAR_LIMIT = 480;
  function truncateForSpeech(text) {
    if (text.length <= SPEECH_CHAR_LIMIT) return text;
    var cut = text.slice(0, SPEECH_CHAR_LIMIT);
    var lastStop = Math.max(cut.lastIndexOf(". "), cut.lastIndexOf("! "), cut.lastIndexOf("? "));
    return lastStop > 80 ? cut.slice(0, lastStop + 1) : cut.trim() + "…";
  }

  function speak(text) {
    if (!synth || !text || muted) return;
    try {
      synth.cancel();
      var utter = new SpeechSynthesisUtterance(text);
      if (chosenVoice) utter.voice = chosenVoice;
      utter.lang = chosenVoice ? chosenVoice.lang : "en-GB";
      utter.rate = 1;
      utter.pitch = 1;
      synth.speak(utter);
    } catch (e) { /* ignore */ }
  }

  // ---- mute toggle: cuts the galaxy off mid-sentence and keeps it quiet --
  var muted = false;
  var muteToggle = document.getElementById("mute-toggle");
  muteToggle.addEventListener("click", function () {
    muted = !muted;
    muteToggle.classList.toggle("muted", muted);
    muteToggle.textContent = muted ? "🔇" : "🔊";
    muteToggle.title = muted ? "Unmute the galaxy's voice" : "Mute the galaxy's voice";
    muteToggle.setAttribute("aria-label", muted ? "Unmute voice output" : "Mute voice output");
    if (muted && synth) synth.cancel(); // stop whatever's playing right now, immediately
  });

  // ---- voice in: webkitSpeechRecognition mic button ----------------------
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognition = null;
  var recognizing = false;
  var finalTranscript = "";

  if (SpeechRecognitionCtor) {
    recognition = new SpeechRecognitionCtor();
    recognition.lang = "en-GB";
    // continuous: with this false, Chrome's endpointer often treats the
    // first short pause as "done talking" and ends the whole session after
    // just a word or two. continuous keeps the session open across pauses
    // - it only really ends when the mic is clicked again (stop()) or a
    // much longer silence elapses - so a full sentence gets captured.
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      recognizing = true;
      finalTranscript = "";
      chatMic.classList.add("listening");
      setStatus("listening");
    };

    recognition.onresult = function (e) {
      // Accumulate every finalized segment as it arrives - continuous mode
      // fires onresult once per segment, not once for the whole session -
      // and only act on it once the session actually ends (onend below).
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) {
          finalTranscript += e.results[i][0].transcript;
        }
      }
    };

    recognition.onerror = function (e) {
      recognizing = false;
      chatMic.classList.remove("listening");
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        setStatus("");
        chatStatus.textContent = "mic access blocked — allow it in the browser's address-bar permissions";
        chatStatus.className = "visible";
      } else if (e.error !== "no-speech" && e.error !== "aborted") {
        setStatus("");
      }
    };

    recognition.onend = function () {
      recognizing = false;
      chatMic.classList.remove("listening");
      if (chatStatus.classList.contains("listening")) setStatus("");
      var transcript = finalTranscript.trim();
      finalTranscript = "";
      if (transcript && !requestBusy) {
        chatInput.value = transcript;
        handleUtterance(transcript);
        chatInput.value = "";
      }
    };

    chatMic.addEventListener("click", function () {
      if (requestBusy) return; // belt-and-suspenders - the button is also disabled while busy
      unlockAudio();
      if (recognizing) {
        recognition.stop();
        return;
      }
      try {
        recognition.start();
      } catch (e) { /* already started */ }
    });
  } else {
    chatMic.disabled = true;
    chatMic.title = "Speech recognition isn't supported in this browser — try Chrome";
  }

  function addChatEntry(question) {
    var entry = document.createElement("div");
    entry.className = "chat-entry pending";

    var q = document.createElement("div");
    q.className = "chat-question";
    q.textContent = question;

    var a = document.createElement("div");
    a.className = "chat-answer";
    a.textContent = "Reading the stars…";

    entry.appendChild(q);
    entry.appendChild(a);
    chatTranscript.appendChild(entry);
    chatTranscript.scrollTop = chatTranscript.scrollHeight;
    return { entry: entry, answerEl: a };
  }

  function askGalaxy(question) {
    if (requestBusy) return;
    requestBusy = true;
    unlockAudio();
    var ui = addChatEntry(question);
    chatSend.disabled = true;
    chatMic.disabled = true;
    setStatus("thinking");

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question, session_id: chatSessionId })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        ui.entry.classList.remove("pending");
        setStatus("");

        if (!result.ok || result.data.error) {
          ui.answerEl.classList.add("error");
          ui.answerEl.textContent = (result.data && result.data.error) || "Something went wrong.";
          return;
        }

        chatSessionId = result.data.session_id || chatSessionId;
        var answer = result.data.answer || "(no answer)";
        var nodeIds = result.data.nodes || [];

        ui.answerEl.textContent = answer;
        speak(truncateForSpeech(answer));
        revealSources(nodeIds);

        if (nodeIds.length) {
          var chips = document.createElement("div");
          chips.className = "chat-sources";
          nodeIds.forEach(function (id) {
            var n = nodesById[id];
            if (!n) return;
            var chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chat-source-chip";
            chip.textContent = n.label;
            chip.addEventListener("click", function () { focusNode(n); });
            chips.appendChild(chip);
          });
          ui.entry.appendChild(chips);
        }
        chatTranscript.scrollTop = chatTranscript.scrollHeight;
      })
      .catch(function () {
        ui.entry.classList.remove("pending");
        setStatus("");
        ui.answerEl.classList.add("error");
        ui.answerEl.textContent = "Could not reach the server.";
      })
      .finally(function () {
        requestBusy = false;
        chatSend.disabled = false;
        chatMic.disabled = false;
      });
  }

  // ---- remember that...: grow the galaxy live, by voice or text ----------
  var REMEMBER_RE = /^\s*remember\s+that\b/i;

  function rememberThis(text) {
    if (requestBusy) return;
    requestBusy = true;
    unlockAudio();
    var ui = addChatEntry(text);
    chatSend.disabled = true;
    chatMic.disabled = true;
    setStatus("thinking");

    fetch("/remember", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        ui.entry.classList.remove("pending");
        setStatus("");

        if (!result.ok || result.data.error) {
          ui.answerEl.classList.add("error");
          ui.answerEl.textContent = (result.data && result.data.error) || "Could not file that note.";
